name: Build Android

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y make build-essential

    - name: Patch Types Header and Makefile for Android
      run: |
        # Replace std::aligned_alloc with posix_memalign safely in types.h
        sed -i 's|std::aligned_alloc(alignment,size)|({ void* ptr=nullptr; posix_memalign(\&ptr, alignment, size); ptr; })|g' src/types.h
        
        # Remove hardcoded flags incompatible with Android's NDK LLVM toolchain
        sed -i 's|-fuse-ld=gold||g' src/Makefile
        sed -i 's|-lpthread||g' src/Makefile

    - name: Compile Arasan for Android (ARM64)
      run: |
        cd src
        rm -rf ../bin/* ../build/*
        
        make -j$(nproc) \
          CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" \
          CXX="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++" \
          ARCH=aarch64 \
          BUILD_TYPE=neon \
          LTO= \
          LIBS="-lc++_shared -lm"
          
        # Strip debugging symbols to optimize final executable size
        "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" ../bin/arasanx-*

    - name: Verify Binary Size
      run: |
        ls -lh bin/
        find bin/ -type f -size -100k -exec echo "Error: Binary is too small!" \; -exec exit 1 \;

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: arasan-android-arm64
        path: bin/arasanx-*
