name: Build Arasan Android ARM64

on:
  workflow_dispatch:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Initialize engine tablebase dependency only
        run: git submodule update --init --recursive -- src/syzygy

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make gawk

      - name: Locate Android NDK
        shell: bash
        run: |
          NDK_DIR="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
          if [[ -z "$NDK_DIR" || ! -x "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++" ]]; then
            SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
            NDK_DIR="$(find "$SDK_DIR/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [[ -z "$NDK_DIR" || ! -x "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++" ]]; then
            echo "Android NDK with the Linux x86_64 LLVM toolchain was not found." >&2
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Using Android NDK: $NDK_DIR"

      - name: Build Arasan engine (ARM64 NEON + Dotprod, API 24)
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -f src/syzygy/src/tbprobe.c || {
            echo "Fathom/Syzygy submodule is missing." >&2
            exit 1
          }

          rm -rf build bin profile prof_data

          make -C src -j"$(nproc)" default \
            CC="$TOOLCHAIN/aarch64-linux-android24-clang++" \
            ARCH=aarch64 \
            BUILD_TYPE=neon \
            ARASAN_VERSION=26.1 \
            NETWORK=arasanv9-20261023.nnue \
            CXXFLAGS="-march=armv8.2-a+dotprod -mtune=cortex-a76" \
            LDFLAGS="-fuse-ld=lld" \
            LTO= \
            CXXLIB="-static-libstdc++" \
            LIBS="-lc -lm" \
            SMPLIB=""

          ENGINE="bin/arasanx-64-neon"
          test -s "$ENGINE"
          "$TOOLCHAIN/llvm-strip" --strip-unneeded "$ENGINE"

          echo "--- Binary ---"
          ls -lh "$ENGINE"
          file "$ENGINE"
          "$TOOLCHAIN/llvm-readelf" -h "$ENGINE"

          "$TOOLCHAIN/llvm-readelf" -h "$ENGINE" | grep -q 'AArch64'
          if "$TOOLCHAIN/llvm-readelf" -d "$ENGINE" | grep -q 'libc++_shared.so'; then
            echo "Unexpected dependency on libc++_shared.so" >&2
            exit 1
          fi

      - name: Upload engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: arasan-android-arm64-neon-dotprod
          path: bin/arasanx-64-neon
          if-no-files-found: error
