name: Build Arasan for Android ARM64 (NEON + Dotprod, Embedded NNUE)

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source and NNUE LFS objects
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Locate and stage the single Arasan NNUE network
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t networks < <(find network -maxdepth 1 -type f -name '*.nnue' -size +1M | sort)
          if [ "${#networks[@]}" -ne 1 ]; then
            echo "Expected exactly one real .nnue network in network/, found ${#networks[@]}"
            find network -maxdepth 1 -type f -printf '%p (%s bytes)\n' || true
            exit 1
          fi
          echo "Using NNUE: ${networks[0]}"
          mkdir -p build bin
          cp "${networks[0]}" build/nnue_network.bin
          test "$(stat -c%s build/nnue_network.bin)" -gt 1000000

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Embed NNUE and build engine only
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p build bin
          (cd build && "$TOOLCHAIN/llvm-objcopy" -I binary -O elf64-littleaarch64 -B aarch64 \
            nnue_network.bin nnue_network.o)
          cd src
          make -j"$(nproc)" \
            CC="$TOOLCHAIN/aarch64-linux-android24-clang++" \
            ARCH=aarch64 BUILD_TYPE=neon \
            CXXFLAGS="-march=armv8.2-a+dotprod -mtune=cortex-a76 -DARASAN_EMBED_NNUE -static-libstdc++" \
            LTO= LIBS="-lm" SMPLIB= \
            LDFLAGS="-fuse-ld=lld"
          cd ..
          "$TOOLCHAIN/llvm-strip" bin/arasanx-*
          test -s bin/arasanx-*
          echo "--- Final executable ---"
          ls -lh bin/arasanx-*
          "$TOOLCHAIN/llvm-readelf" -h bin/arasanx-* | grep -E 'Class:|Machine:'
          "$TOOLCHAIN/llvm-nm" bin/arasanx-* | grep -E '_binary_nnue_network_bin_(start|end)' || true

      - name: Upload single self-contained engine
        uses: actions/upload-artifact@v4
        with:
          name: arasan-android-arm64-neon-dotprod-embedded-nnue
          path: bin/arasanx-*
          if-no-files-found: error
